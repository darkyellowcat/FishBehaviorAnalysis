# Synthetic S5 ideal pixel model, not measured apparatus or metric calibration.
data_source: synthetic
video:
  expected_width: 160
  expected_height: 120
  fps_fallback: 10.0
preprocessing:
  median_kernel: 3
  calibration_file: null
rois:
  mirror: {x: 0, y: 0, width: 64, height: 120}
  real: {x: 64, y: 0, width: 96, height: 120}
synthetic_video:
  frame_count: 18
  fps: 10.0
  codec: MJPG
  background_only_frames: 3
  missing_frame_ids: [8, 9]
  fish_axes_px: [8, 4]
  horizontal_motion_px: 12
  background_bgr: [30, 30, 30]
  mirror_fish_bgr: [240, 180, 40]
  real_fish_bgr: [40, 180, 240]
som:
  mapping_size: 3
  learning_frames: 3
  epsilon_learning: 0.1
  epsilon_online: 0.01
  learning_rate: 0.05
  gaussian_sigma: 1.0
  shadow_gamma: 0.7
  shadow_beta: 1.0
  shadow_saturation_tolerance: 0.1
  shadow_hue_tolerance_deg: 10.0
centroid:
  min_area_px: 40
  max_area_px: 500
  opening_kernel: 3
  closing_kernel: 3
  connectivity: 8
tracking:
  max_speed_px_s: 80.0
  max_gap_s: 0.5
matching:
  max_y_disparity_px: 3.0  # Engineering gate for aligned ideal views.
geometry:
  mirror_angle_deg: 45.0  # Paper baseline angle, not an actual measurement.
  mirror_intersection_x_px: 64.0  # Full-frame geometric reference; independently set.
  image_origin_px: [0.0, 0.0]
  coordinate_unit: model_px
  coordinate_frame: paper_ideal_cartesian
